<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hexFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A95BFF"/>
      <stop offset="55%" stop-color="#8F2FFE"/>
      <stop offset="100%" stop-color="#DF53FE"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0CFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7B23E0" stop-opacity="0.4"/>
