<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" width="360" height="88" role="img" aria-label="BlackCrownTech">
  <defs>
    <linearGradient id="hexFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A95BFF"/>
      <stop offset="55%" stop-color="#8F2FFE"/>
      <stop offset="100%" stop-color="#DF53FE"/>
    </linearGradient>
    <linearGradient id="hexStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0CFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7B23E0" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E9DDFA"/>
    </linearGradient>
    <radialGradient id="sheen" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(6 12)" filter="url(#glow)">
    <polygon points="32,2 60,18 60,46 32,62 4,46 4,18"
             fill="url(#hexFill)" stroke="url(#hexStroke)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="32,2 60,18 60,46 32,62 4,46 4,18"
             fill="url(#sheen)"/>
    <text x="32" y="40"
          font-family="Inter, system-ui, sans-serif"
          font-weight="800"
          font-size="20"
          text-anchor="middle"
          fill="#FFFFFF"
          letter-spacing="-0.5">BCT</text>
  </g>

  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="-0.8">
    <text x="80" y="52" font-size="28" fill="url(#wordmark)">Black<tspan fill="#DF53FE">Crown</tspan>Tech</text>
  </g>
</svg>
